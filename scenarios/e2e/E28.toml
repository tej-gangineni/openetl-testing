name = "e2e_E28_pg_ssh"

[[sources]]
id = "files"
type = "local"
mode = "full_refresh"
path = "${lab}/downloads/logs-parts/SSH"
filter = "SSH-00000*.log"

[[transforms]]
type = "extract"
strategy = "fast"
entities = false

[[sinks]]
id = "out"
type = "postgres"
write_mode = "append"
table = "e2e_ssh_logs"
dsn = "postgresql://lab:lab@127.0.0.1:5433/openetl"
