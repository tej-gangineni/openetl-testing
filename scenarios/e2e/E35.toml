name = "e2e_E35_es_healthapp"

[[sources]]
id = "files"
type = "local"
mode = "full_refresh"
path = "${lab}/downloads/logs-parts/HealthApp"
filter = "HealthApp-00000*.log"

[[transforms]]
type = "extract"
strategy = "fast"
entities = false

[[sinks]]
id = "out"
type = "elasticsearch"
write_mode = "append"
index = "e2e_healthapp_logs"
url = "http://127.0.0.1:9200"
